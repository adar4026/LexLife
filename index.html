<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
  />
  <meta name="theme-color" content="#0d1117" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="LexLife" />
  <meta name="description" content="Личное приложение здоровья: анализы, активность, лекарства, визиты — всё офлайн." />
  <title>LexLife</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/lexlife-icon-180.png" />

  <!-- Шрифты из ТЗ: Unbounded (заголовки), Mulish (тело) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Mulish:wght@400;600;700;800&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app" id="app">
    <!-- Аватар профиля — кнопка бокового меню (на основных экранах); содержимое — из профиля (buildDrawer) -->
    <button class="avatar-btn" id="avatar-btn" type="button" aria-label="Открыть меню" aria-controls="drawer">
      <span class="avatar-btn__img" id="avatar-btn-img" aria-hidden="true"></span>
    </button>

    <main class="screen" id="screen" role="main"></main>

    <!-- Нижняя навигация — плавающая капсула (как в LexMoney): Главная · Показатели · Лекарства · Анализы.
         Один общий индикатор переезжает между колонками (js/ui/bottomNav.js). -->
    <nav class="tab-bar" id="tab-bar" aria-label="Основные разделы" style="--nav-count:4">
      <span class="tab-bar__indicator" aria-hidden="true"></span>
      <a class="tab" href="#/home" data-route="home">
        <svg class="tab__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5"/><path d="M6 10v9h12v-9"/><path d="M10 19v-5h4v5"/></svg>
        <span class="tab__label">Главная</span>
      </a>
      <a class="tab" href="#/metrics" data-route="metrics">
        <svg class="tab__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg>
        <span class="tab__label">Показатели</span>
      </a>
      <a class="tab" href="#/meds" data-route="meds">
        <svg class="tab__icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.8" y="8.3" width="18.4" height="7.4" rx="3.7" transform="rotate(-45 12 12)"/><path d="m9.4 9.4 5.2 5.2"/></svg>
        <span class="tab__label">Лекарства</span>
      </a>
      <a class="tab" href="#/tests" data-route="tests">
        <svg class="tab__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3.5h6"/><path d="M10 3.5v6L5 18.3a1.8 1.8 0 0 0 1.6 2.7h10.8a1.8 1.8 0 0 0 1.6-2.7L14 9.5v-6"/><path d="M7.4 15h9.2"/></svg>
        <span class="tab__label">Анализы</span>
      </a>
    </nav>
  </div>

  <!-- Боковое меню (Drawer) + затемнение -->
  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" aria-label="Боковое меню"></aside>

  <script type="module" src="js/app.js"></script>
</body>
</html>
